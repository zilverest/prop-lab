name: eevee-tick

on:
  schedule:
    - cron: "0 */6 * * *"        # every 6h UTC: 00,06,12,18 -> 8pm,2am,8am,2pm ET
  workflow_dispatch:             # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: eevee
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tick
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 run.py

      - name: Commit data + dashboard
        run: |
          git config user.name "eevee-bot"
          git config user.email "eevee-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "tick $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main || true
          git push
