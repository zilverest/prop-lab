name: eevee-tick

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eevee
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax + offline tests
        run: |
          python3 -m py_compile common.py snapshot.py close.py closing_capture.py instrumentation.py shadow_lab.py evidence_report.py parlay_lab.py sgp_shadow.py slips.py run.py
          python3 -m unittest discover -s tests -v

      - name: Compact retained research data
        run: python3 maintenance.py

      - name: Capture exact board
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 run.py --phase capture

      - name: Commit immutable board checkpoint
        run: |
          git config user.name "eevee-bot"
          git config user.email "eevee-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "capture $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main || true
          git push

      - name: Freeze research decisions
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 run.py --phase research

      - name: Commit frozen decisions
        run: |
          git config user.name "eevee-bot"
          git config user.email "eevee-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "freeze $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main || true
          git push

      - name: Settle + closing-line evidence
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 run.py --phase settle

      - name: Commit settlement + reports
        run: |
          git config user.name "eevee-bot"
          git config user.email "eevee-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "settle $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main || true
          git push
