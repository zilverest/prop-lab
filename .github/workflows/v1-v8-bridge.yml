name: v1-v8-full-history-bridge

on:
  push:
    paths:
      - "v1_v8_bridge.py"
      - "common.py"
      - "data/parlay_decisions.csv"
      - "research/historical_ablation_tournament/benchmark.csv"
      - ".github/workflows/v1-v8-bridge.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eevee
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate bridge
        run: |
          python3 -m py_compile v1_v8_bridge.py
          python3 -m unittest tests.test_v1_v8_bridge -v

      - name: Build canonical V1-V8 ledger
        run: python3 v1_v8_bridge.py

      - name: Refresh dashboard from bridge
        run: python3 -c "import parlay_lab; parlay_lab.write_dashboard()"

      - name: Commit bridge outputs
        run: |
          git config user.name "eevee-bot"
          git config user.email "eevee-bot@users.noreply.github.com"
          git add research/v1_v8_bridge/ docs/index.html
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Update V1-V8 full-history bridge"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME"
