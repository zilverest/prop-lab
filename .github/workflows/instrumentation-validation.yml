name: instrumentation-validation

on:
  push:
    paths:
      - "run.py"
      - "snapshot.py"
      - "closing_capture.py"
      - "instrumentation.py"
      - "shadow_lab.py"
      - "common.py"
      - "parlay_lab.py"
      - "sgp_shadow.py"
      - "tests/**"
      - ".github/workflows/instrumentation-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python3 -m py_compile common.py snapshot.py close.py closing_capture.py instrumentation.py shadow_lab.py parlay_lab.py sgp_shadow.py slips.py run.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
