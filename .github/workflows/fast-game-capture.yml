name: eevee-fast-game-capture

on:
  schedule:
    - cron: "30 * * * 0,1,4"
    - cron: "30 16-23 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eevee
  cancel-in-progress: false

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture near-game board
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 run.py --phase capture --hours-before 30 --no-legacy-sgp

      - name: Commit near-game checkpoint
        run: |
          git config user.name "eevee-bot"
          git config user.email "eevee-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "fast capture $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main || true
          git push

      - name: Freeze if eligible
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 run.py --phase research --no-legacy-auto

      - name: Commit any frozen decisions
        run: |
          git config user.name "eevee-bot"
          git config user.email "eevee-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "fast freeze $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main || true
          git push
